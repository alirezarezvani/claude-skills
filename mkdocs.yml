extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alirezarezvani/claude-skills
      name: GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/nginitycloud
      name: Twitter
    - icon: fontawesome/brands/medium
      link: https://alirezarezvani.medium.com
      name: Medium
  generator: false

hooks:
  - scripts/docs_hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home:
    - Overview: index.md
    - Getting Started: getting-started.md
    - "What's New": whats-new.md
  - Skills:
    - Overview: skills/index.md
  - Plugins:
    - Overview: plugins/index.md
  - Agents:
    - Overview: agents/index.md
    - Personas:
      - Overview: personas/index.md
      - "Startup CTO": personas/startup-cto.md
      - "Growth Marketer": personas/growth-marketer.md
      - "Solo Founder": personas/solo-founder.md
    - Orchestration: orchestration.md
  - Commands:
    - Overview: commands/index.md
  - Other Tools:
    - Multi-Tool Integrations: integrations.md
    - "Best Claude Code Plugins": guides/best-claude-code-plugins.md
    - "Agent Skills for Codex": guides/agent-skills-for-codex.md
    - "Gemini CLI Skills Guide": guides/gemini-cli-skills-guide.md
    - "Cursor Skills Guide": guides/cursor-skills-guide.md
    - "OpenClaw Skills Guide": guides/openclaw-skills-guide.md
    - "Hermes Agent Skills Guide": guides/hermes-agent-skills-guide.md
    - "Mistral Vibe Skills Guide": guides/mistral-vibe-skills-guide.md
    - Custom GPTs: custom-gpts.md
