        'skills/c-level-advisor/c-level-agents-cfo-review.md': 'skills/c-level-agents/cfo-review.md'
        'skills/c-level-advisor/c-level-agents-ciso-review.md': 'skills/c-level-agents/ciso-review.md'
        'skills/c-level-advisor/c-level-agents-cmo-review.md': 'skills/c-level-agents/cmo-review.md'
        'skills/c-level-advisor/c-level-agents-cpo-review.md': 'skills/c-level-agents/cpo-review.md'
