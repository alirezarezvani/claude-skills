site_name: Claude Code Skills & Agent Plugins
site_url: https://alirezarezvani.github.io/claude-skills/
site_description: "415 production-ready skills across 20 domains, 112 marketplace plugins, and 173 slash commands for engineering, product, marketing, compliance, finance, research, and agent tooling. Works with Claude Code, OpenAI Codex, Gemini CLI, Cursor, Hermes Agent, Mistral Vibe, OpenClaw, and 6 more AI coding tools. Open source, MIT licensed, zero dependencies."
site_author: Alireza Rezvani
repo_url: https://github.com/alirezarezvani/claude-skills
repo_name: alirezarezvani/claude-skills
edit_uri: edit/dev/docs/
copyright: "Built by Alireza Rezvani"

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - header.autohide
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    annotation: material/chevron-right-circle

plugins:
  - search:
      separator: '[\s\-\.]+'
  # Per-page social preview cards. Off by default (needs cairo + pillow);
  # static.yml turns it on for the Pages deploy with SOCIAL_CARDS=true.
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
  - tags
  - redirects:
      redirect_maps:
        # Dual-publish duplicate cleanup (v2.5.6 docs refresh).
        # The auto-generator created <name>-<name>.md alongside the canonical
        # <name>.md for engineering plugins that publish both standalone and
        # bundled. Redirect old URLs to the canonical page to preserve SEO.
        'skills/engineering/chaos-engineering-chaos-engineering.md': 'skills/engineering/chaos-engineering.md'
        'skills/engineering/feature-flags-architect-feature-flags-architect.md': 'skills/engineering/feature-flags-architect.md'
        'skills/engineering/kubernetes-operator-kubernetes-operator.md': 'skills/engineering/kubernetes-operator.md'
        'skills/engineering/slo-architect-slo-architect.md': 'skills/engineering/slo-architect.md'
        # Skills removed/renamed upstream — redirect old indexed URLs to their successors.
        'skills/marketing-skill/ai-seo.md': 'skills/marketing-skill/aeo.md'
        'skills/engineering/release-manager.md': 'skills/engineering/changelog-generator.md'
        'skills/engineering/command-guide.md': 'skills/engineering/index.md'
        # Pages the generator renamed (sub-skill folders, c-level-agents domain split).
        'skills/business-growth/business-growth.md': 'skills/business-growth/index.md'
        'skills/c-level-advisor/c-level-advisor.md': 'skills/c-level-advisor/index.md'
        'skills/c-level-advisor/c-level-agents-boardroom.md': 'skills/c-level-agents/boardroom.md'
        'skills/c-level-advisor/c-level-agents-brief.md': 'skills/c-level-agents/brief.md'
